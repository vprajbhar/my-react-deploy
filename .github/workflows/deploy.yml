name: Deploy React to Hostinger

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        
      - name: Test Hostinger SSH
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" \
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          source: "dist/*"
          target: "domains/mytravelinindia.in/public_html/"
          strip_components: 1