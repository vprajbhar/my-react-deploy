name: Deploy React App to Hostinger

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string

# Minimum required GitHub token permissions
permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout selected branch
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React/Vite application
      - name: Build React application
        run: npm run build

      # 5. Verify build output
      - name: Verify build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Build completed successfully."
          echo "Contents of dist:"
          ls -la dist

      # 6. Deploy build to Hostinger
      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          port: ${{ secrets.HOSTINGER_PORT }}

          # SSH private key authentication
          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          # Verify Hostinger's SSH host key
          fingerprint: ${{ secrets.HOSTINGER_FINGERPRINT }}

          # Upload contents of dist
          source: "dist/*"
          target: "domains/mytravelinindia.in/public_html/"

          # Remove the "dist" directory level
          strip_components: 1

          timeout: 30s
          command_timeout: 10m 