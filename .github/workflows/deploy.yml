name: Deploy React App to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Build React application
      - name: Build React application
        run: npm run build
        
        # 6. Test SSH connection
      - name: Test Hostinger SSH
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" \
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "echo 'SSH connection successful'"

      # 6. Deploy dist to Hostinger
      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "dist/*"
          target: "domains/mytravelinindia.in/public_html/"
          strip_components: 1